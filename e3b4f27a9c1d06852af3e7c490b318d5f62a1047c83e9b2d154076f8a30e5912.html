<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Secure Media Session</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --btn-bg: #3b82f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-size: 24px;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-muted);
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        audio {
            width: 100%;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            background-color: var(--btn-bg);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
        }

        button:active {
            transform: scale(0.98);
        }

        #status {
            margin-top: 25px;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .status-active {
            color: var(--accent-green) !important;
            border-color: var(--accent-green) !important;
            background-color: rgba(16, 185, 129, 0.1) !important;
        }

        .status-stopped {
            color: var(--accent-red) !important;
            border-color: var(--accent-red) !important;
            background-color: rgba(239, 68, 68, 0.1) !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Secure Media Portal</h2>
    <p>The session will instantly terminate if you move your mouse, type, touch the screen, shake the device, or leave the browser window.</p>
    
    <audio id="myAudio" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" controls></audio>
    
    <button id="startBtn">Initialize Secure Session</button>
    
    <div id="status">Status: Awaiting Initialization</div>
</div>

<script>
    const audio = document.getElementById('myAudio');
    const startBtn = document.getElementById('startBtn');
    const statusDiv = document.getElementById('status');
    
    let mediaRecorder = null;
    let streamInstance = null;
    let isSessionActive = false;

    // Configuration threshold for phone movement (tweak if too sensitive/loose)
    const MOVEMENT_THRESHOLD = 1.5; 

    // Unified function to terminate everything safely
    function triggerLockdown(reason) {
        if (!isSessionActive) return;
        
        isSessionActive = false;

        // 1. Force halt audio playback
        audio.pause();
        
        // 2. Force stop mic recording
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
            mediaRecorder.stop();
        }

        // 3. Kill the hardware mic stream completely (turns off the device recording light)
        if (streamInstance) {
            streamInstance.getTracks().forEach(track => track.stop());
        }
        
        // 4. Update UI Styling
        statusDiv.innerText = `🚨 SESSION BREACHED: ${reason}`;
        statusDiv.className = "status-stopped";
        
        // Remove tracking to prevent looping triggers
        removeAllListeners();
    }

    // Requests hardware access and fires up the protection loop
    async function startSecureSession() {
        // Handle iOS WebKit requirement for explicit permission requests for Device Orientation
        if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
            try {
                const permissionState = await DeviceOrientationEvent.requestPermission();
                if (permissionState !== 'granted') {
                    alert("Motion sensors are required to run this session on mobile.");
                    return;
                }
            } catch (error) {
                console.error("Sensor permission denied", error);
            }
        }

        try {
            // Request system microphone access
            streamInstance = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(streamInstance);
            
            // Start recording and audio playback simultaneously 
            mediaRecorder.start();
            audio.play();
            
            isSessionActive = true;
            statusDiv.innerText = "🔒 Session Secure. Do not move.";
            statusDiv.className = "status-active";
            
            addAllListeners();
        } catch (err) {
            alert("Microphone permission must be accepted to start recording.");
            console.error(err);
        }
    }

    // --- EVENT LISTENERS PACK ---

    // Desktop Triggers
    const onMouseMove = () => triggerLockdown("Mouse Movement Detected");
    const onKeyDown = () => triggerLockdown("Keystroke Detected");

    // Mobile Triggers
    const onTouchMove = () => triggerLockdown("Screen Interaction Detected");
    const onDeviceMove = (event) => {
        const { beta, gamma } = event;
        if (beta === null || gamma === null) return;

        // Triggers lockdown if tilted past the threshold values
        if (Math.abs(beta) > MOVEMENT_THRESHOLD || Math.abs(gamma) > MOVEMENT_THRESHOLD) {
            triggerLockdown("Physical Device Movement Detected");
        }
    };

    // Universal Exit Trigger (Tab changing, phone locking, minimize app)
    const onVisibilityChange = () => {
        if (document.hidden) {
            triggerLockdown("App Minimization/Tab Switch Detected");
        }
    };

    function addAllListeners() {
        // Enforce a subtle 800ms delay window so the initial button tap doesn't immediately self-trigger
        setTimeout(() => {
            if (!isSessionActive) return;
            
            // Desktop registers
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('keydown', onKeyDown);
            
            // Mobile registers
            window.addEventListener('touchmove', onTouchMove);
            window.addEventListener('deviceorientation', onDeviceMove);
            
            // System App state registers
            document.addEventListener('visibilitychange', onVisibilityChange);
        }, 800);
    }

    function removeAllListeners() {
        window.removeEventListener('mousemove', onMouseMove);
        window.removeEventListener('keydown', onKeyDown);
        window.removeEventListener('touchmove', onTouchMove);
        window.removeEventListener('deviceorientation', onDeviceMove);
        document.removeEventListener('visibilitychange', onVisibilityChange);
    }

    startBtn.addEventListener('click', startSecureSession);
</script>

</body>
</html>
