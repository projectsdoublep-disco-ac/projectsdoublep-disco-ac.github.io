<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>disco</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    :root {
        --bg: #050505;
        --text: #ffffff;
        --accent: #1a1a1a;
        --highlight: #222;
        --watermark: rgba(255, 255, 255, 0.03);
        --alert: #b00000;
        --warning: #ca8a04;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg);
        color: var(--text);
        height: 100vh;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
        user-select: none;
        -webkit-user-select: none;
        touch-action: none; /* Prevents scrolling/swiping */
    }

    /* Security Watermarks */
    .watermark-overlay {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 9999;
        background-image: 
            linear-gradient(45deg, var(--watermark) 25%, transparent 25%, transparent 75%, var(--watermark) 75%, var(--watermark)),
            linear-gradient(45deg, var(--watermark) 25%, transparent 25%, transparent 75%, var(--watermark) 75%, var(--watermark));
        background-size: 60px 60px;
        background-position: 0 0, 30px 30px;
    }
    .confidential-stamp {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(-45deg);
        font-size: 80px;
        font-weight: 900;
        color: rgba(255, 0, 0, 0.05);
        z-index: 9998;
        pointer-events: none;
        border: 5px solid rgba(255, 0, 0, 0.05);
        padding: 20px;
        text-transform: uppercase;
    }

    /* Main Layout */
    .player-container {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        z-index: 1;
        padding: 20px;
    }

    .header-info {
        width: 100%;
        max-width: 400px;
        margin-bottom: 30px;
        text-align: left;
        border-left: 2px solid #333;
        padding-left: 15px;
    }

    .track-title {
        font-size: 24px;
        font-weight: 700;
        color: #fff;
        margin-bottom: 5px;
        letter-spacing: -0.5px;
    }

    .track-artist {
        font-size: 14px;
        color: #666;
        font-weight: 400;
    }

    .warning-label {
        font-size: 10px;
        color: #333;
        margin-top: 10px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }

    /* Visualizer Area */
    .visualizer-box {
        width: 200px;
        height: 200px;
        background: #111;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 40px;
        box-shadow: 0 0 50px rgba(0,0,0,0.5);
        border: 1px solid #222;
        position: relative;
    }

    .visualizer-box::after {
        content: "DOUBLE P RECORDS";
        position: absolute;
        bottom: 20px;
        font-size: 8px;
        color: #333;
        letter-spacing: 2px;
    }

    .audio-wave-icon {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 40px;
    }

    .audio-wave-icon span {
        display: block;
        width: 4px;
        background: #333;
        border-radius: 2px;
        animation: none;
    }

    .audio-wave-icon.active span {
        background: #fff;
        animation: wave 0.5s infinite ease-in-out alternate;
    }

    .audio-wave-icon.active span:nth-child(1) { height: 10px; animation-delay: 0.1s; }
    .audio-wave-icon.active span:nth-child(2) { height: 20px; animation-delay: 0.2s; }
    .audio-wave-icon.active span:nth-child(3) { height: 30px; animation-delay: 0.3s; }
    .audio-wave-icon.active span:nth-child(4) { height: 20px; animation-delay: 0.4s; }
    .audio-wave-icon.active span:nth-child(5) { height: 10px; animation-delay: 0.5s; }

    @keyframes wave {
        0% { transform: scaleY(0.5); opacity: 0.5; }
        100% { transform: scaleY(1.5); opacity: 1; }
    }

    /* Controls */
    .controls {
        display: flex;
        gap: 30px;
        align-items: center;
    }

    .control-btn {
        background: none;
        border: none;
        color: #333;
        font-size: 20px;
        cursor: not-allowed;
        transition: color 0.2s;
    }

    .play-pause-btn {
        width: 60px;
        height: 60px;
        background: #fff;
        color: #000;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 24px;
        cursor: pointer;
        box-shadow: 0 0 20px rgba(255,255,255,0.1);
    }

    .play-pause-btn:hover {
        transform: scale(1.05);
    }

    /* Fake Log Terminal */
    .log-terminal {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 150px;
        background: linear-gradient(to top, #000 0%, transparent 100%);
        z-index: 100;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 20px;
        font-family: 'Courier New', monospace;
        font-size: 10px;
        color: #333;
        text-align: left;
    }

    .log-entry {
        margin-bottom: 2px;
        opacity: 0.7;
    }

    .log-entry.error {
        color: var(--alert);
        font-weight: bold;
    }

    /* Footer Branding */
    .footer-brand {
        position: fixed;
        bottom: 20px;
        right: 20px;
        font-size: 10px;
        color: #222;
        z-index: 10;
        pointer-events: none;
    }

    .status-badge {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #111;
        border: 1px solid #333;
        color: #333;
        padding: 5px 10px;
        font-size: 10px;
        border-radius: 4px;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 5px;
    }

    .status-dot {
        width: 6px;
        height: 6px;
        background: #333;
        border-radius: 50%;
    }

    .status-dot.active {
        background: #00ff00;
        box-shadow: 0 0 5px #00ff00;
    }

    /* Session Warning Banner */
    .session-warning {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(202, 138, 4, 0.1);
        border-bottom: 1px solid var(--warning);
        padding: 10px;
        text-align: center;
        z-index: 10000;
        backdrop-filter: blur(5px);
    }

    .session-warning-text {
        color: var(--warning);
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>
</head>
<body>

<!-- Session Warning Banner -->
<div class="session-warning">
    <div class="session-warning-text">
        <i class="fa-solid fa-clock"></i> Temporary Session - Any Interaction Will Terminate Access
    </div>
</div>

<!-- Security Layers -->
<div class="watermark-overlay"></div>
<div class="confidential-stamp">CONFIDENTIAL // EMPLOYEE ONLY</div>

<div class="status-badge">
    <div class="status-dot" id="security-status"></div>
    <span id="security-text">SECURE CONNECTION</span>
</div>

<div class="player-container">
    <div class="header-info">
        <div class="track-title">Nina - Peso Pluma</div>
        <div class="track-artist">Double P Records / Disco.ac</div>
        <div class="warning-label">
            <i class="fa-solid fa-lock"></i> Protected Content // No Recording Allowed
        </div>
    </div>

    <div class="visualizer-box">
        <div class="audio-wave-icon" id="wave-visualizer">
            <span></span><span></span><span></span><span></span><span></span>
        </div>
    </div>

    <div class="controls">
        <button class="control-btn"><i class="fa-solid fa-backward-step"></i></button>
        <button class="play-pause-btn" id="play-btn">
            <i class="fa-solid fa-play" id="play-icon"></i>
        </button>
        <button class="control-btn"><i class="fa-solid fa-forward-step"></i></button>
    </div>
</div>

<div class="log-terminal" id="log-terminal">
    <!-- Logs generated by JS -->
</div>

<div class="footer-brand">
    disco.ac // Double P Records // Internal Use Only
</div>

<!-- Hidden Audio Element -->
<audio id="audio-player" preload="auto" crossorigin="anonymous">
    <source src="https://github.com/projectsdoublep-disco-ac/projectsdoublep-disco-ac.github.io/raw/refs/heads/main/@AudioFactoryBot%20(4).mp3" type="audio/mpeg">
</audio>

<script>
    // --- Security & Anti-Tamper Configuration ---
    const audio = document.getElementById('audio-player');
    const playBtn = document.getElementById('play-btn');
    const playIcon = document.getElementById('play-icon');
    const waveVisualizer = document.getElementById('wave-visualizer');
    const logTerminal = document.getElementById('log-terminal');
    const securityStatus = document.getElementById('security-status');
    const securityText = document.getElementById('security-text');

    let isPlaying = false;
    let audioContext = null;
    let sourceNode = null;
    let analyser = null;
    let hasPlayedOnce = false;

    // --- Fake Log Generator ---
    const logMessages = [
        "Initializing secure stream...",
        "Verifying user credentials...",
        "Access granted: Employee ID [REDACTED]",
        "Loading asset: Nina - Peso Pluma",
        "DRM Check: Passed",
        "Watermark injection: Active",
        "Monitoring for screen capture APIs...",
        "Connection secured via disco.ac private network",
        "WARNING: Session will terminate on any interaction"
    };

    function addLog(msg, isError = false) {
        const div = document.createElement('div');
        div.className = 'log-entry' + (isError ? ' error' : '');
        const time = new Date().toLocaleTimeString('en-US', { hour12: false });
        div.textContent = `[${time}] ${msg}`;
        logTerminal.appendChild(div);
        if (logTerminal.children > 8) {
            logTerminal.removeChild(logTerminal.firstChild);
        }
    }

    // Initialize logs
    logMessages.forEach(msg => setTimeout(() => addLog(msg), Math.random * 2000));

    // --- SECURITY: BOOT FUNCTION ---
    function bootUser() {
        addLog("SECURITY BREACH DETECTED. TERMINATING SESSION.", true);
        // Redirect to Google
        window.location.href = "https://www.google.com";
    }

    // --- Security Measures ---
    
    // Disable Right Click
    document.addEventListener('contextmenu', event => {
        event.preventDefault();
        bootUser();
    });

    // Disable Key Shortcuts (Ctrl+C, Ctrl+U, etc)
    document.addEventListener('keydown', event => {
        bootUser();
    });

    // Disable Touch/Mouse Actions (Any click boots)
    document.addEventListener('click', event => {
        // Allow the play button to work ONLY if it's the first click and directly on the play button
        if (event.target.closest('#play-btn') && !hasPlayedOnce) {
            // Let the play button handler run first
            return;
        }
        bootUser();
    });

    document.addEventListener('touchstart', event => {
        if (event.target.closest('#play-btn') && !hasPlayedOnce) {
            return;
        }
        bootUser();
    }, { passive: false });

    document.addEventListener('mousedown', event => {
        if (event.target.closest('#play-btn') && !hasPlayedOnce) {
            return;
        }
        bootUser();
    });

    // Prevent default drag behaviors
    window.ondragstart = function() { return false; }

    // Detect Screen Recording (Basic API check)
    if (navigator.getDisplayMedia) {
        addLog("Screen sharing API monitored.");
        // Note: Actual detection of screen recording is limited in browsers without DRM
    }

    // --- Audio Logic ---

    function initAudioContext() {
        if (!audioContext) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            sourceNode = audioContext.createMediaElementSource(audio);
            analyser = audioContext.createAnalyser();
            sourceNode.connect(analyser);
            analyser.connect(audioContext.destination);
            analyser.fftSize = 256;
        }
    }

    function updateUI() {
        if (isPlaying) {
            playIcon.classList.remove('fa-play');
            playIcon.classList.add('fa-pause');
            waveVisualizer.classList.add('active');
            securityStatus.classList.add('active');
            securityText.textContent = "STREAMING SECURELY";
            securityText.style.color = "#00ff00";
            addLog("Audio stream active. Do not interact.");
        } else {
            playIcon.classList.remove('fa-pause');
            playIcon.classList.add('fa-play');
            waveVisualizer.classList.remove('active');
        }
    }

    playBtn.addEventListener('click', (e) => {
        e.stopPropagation(); // Prevent the document click handler from firing
        if (isPlaying) {
            audio.pause();
            isPlaying = false;
            updateUI();
            addLog("Playback paused.");
        } else {
            // Browser policy requires user interaction first
            initAudioContext();
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            audio.play().then(() => {
                isPlaying = true;
                hasPlayedOnce = true; // After this, any click boots
                updateUI();
                addLog("Playback started. Session active.");
            }).catch(e => {
                addLog("Playback failed: " + e.message, true);
            });
        }
    });

    audio.addEventListener('ended', () => {
        isPlaying = false;
        updateUI();
        addLog("Stream ended. Terminating session.", true);
        bootUser();
    });

    audio.addEventListener('error', (e) => {
        addLog("Audio source error. File may be removed.", true);
        bootUser();
    });

    // Handle audio ending
    audio.onended = function() {
        bootUser();
    };

</script>
</body>
</html>
