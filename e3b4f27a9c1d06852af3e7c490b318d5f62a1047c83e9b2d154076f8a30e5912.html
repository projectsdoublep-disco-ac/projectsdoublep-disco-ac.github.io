<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--text:#111827;--muted:#6b7280;--accent:#000;--wp:#2c3135;--wr:#d1d5db}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
.tab-nav{display:flex;background:#f3f4f6;border-bottom:1px solid #e5e7eb;position:sticky;top:0;z-index:100;width:100%;transition:max-height .3s,opacity .3s;max-height:60px;overflow:hidden;opacity:1}
.tab-nav.hidden-tabs{max-height:0!important;border-bottom:none;opacity:0;pointer-events:none}
.tab-btn{flex:1;padding:16px 12px;text-align:center;font-size:15px;font-weight:600;color:var(--muted);background:none;border:none;cursor:pointer;border-bottom:3px solid transparent;transition:all .2s;display:flex;justify-content:center;align-items:center;gap:8px}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent);background:#fff}
.tab-panel{display:none;width:100%;flex:1}
.tab-panel.active{display:flex;flex-direction:column}
.manager-view{padding:24px;max-width:600px;width:100%;margin:0 auto}
.dashboard-title{font-size:22px;font-weight:700;margin-bottom:20px}
.upload-zone{border:2px dashed #d1d5db;border-radius:12px;padding:30px 20px;text-align:center;cursor:pointer;transition:all .2s;margin-bottom:16px;background:#fafafa}
.upload-zone:hover{border-color:var(--accent);background:#f3f4f6}
.upload-zone i{font-size:36px;color:var(--muted);margin-bottom:12px}
.upload-zone p{font-size:14px;color:var(--muted);line-height:1.5}
#file-input{display:none}
.divider-row{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.divider-row hr{flex:1;border:none;border-top:1px solid #e5e7eb}
.divider-row span{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.url-type-select{display:flex;gap:8px;margin-bottom:10px}
.url-type-select label{font-size:12px;font-weight:600;color:#4b5563;display:flex;align-items:center;gap:5px;cursor:pointer}
.url-type-select input[type=radio]{accent-color:var(--accent)}
.url-input-row{display:flex;gap:8px;margin-bottom:24px}
.url-input-row input{flex:1;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none}
.url-input-row input:focus{border-color:var(--accent)}
.url-input-row button{padding:12px 16px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:13px;white-space:nowrap}
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#4b5563}
.form-group input{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;outline:none}
.form-group input:focus{border-color:var(--accent)}
.primary-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:14px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px}
.track-list-container{margin-top:30px;border-top:1px solid #e5e7eb;padding-top:20px}
.track-item{display:flex;justify-content:space-between;align-items:center;padding:12px;border-radius:8px;background:#f9fafb;margin-bottom:8px;cursor:pointer;border:1px solid transparent}
.track-item.active{background:#f3f4f6;border-color:var(--accent)}
.track-item-info{flex:1;overflow:hidden}
.track-item-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track-item-meta{font-size:12px;color:var(--muted);margin-top:2px}
.track-actions{display:flex;gap:4px}
.action-btn{background:none;border:none;cursor:pointer;color:#9ca3af;font-size:14px;padding:6px}
.action-btn.edit-btn:hover{color:#2563eb}
.action-btn.delete-btn:hover{color:#dc2626}
.player-view{width:100%;max-width:430px;margin:0 auto;padding:24px;display:flex;flex-direction:column;align-items:center}
.top-bar{width:100%;display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
.top-bar i{font-size:20px;color:var(--accent);cursor:pointer;padding:10px}
.top-bar i.fa-chevron-down{transition:transform .3s}
.top-bar i.fa-chevron-down.tabs-are-hidden{transform:rotate(180deg)}
.track-info{font-size:17px;font-weight:400;color:#2c2c2c;margin-bottom:24px;text-align:center;letter-spacing:-.3px;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage-viewport-container{width:100%;aspect-ratio:1/1;margin-bottom:30px;position:relative}
.album-art-container{width:100%;height:100%;background:linear-gradient(135deg,#eef1f4,#e0e5ec);border-radius:24px;display:flex;justify-content:center;align-items:center;box-shadow:0 20px 35px -5px rgba(0,0,0,.35),0 10px 15px -5px rgba(0,0,0,.2)}
.native-video-render{width:100%;height:100%;object-fit:cover;border-radius:24px;background:#000;box-shadow:0 20px 35px -5px rgba(0,0,0,.35);display:none}
.audio-wave-icon{display:flex;align-items:center;gap:3px}
.audio-wave-icon span{display:block;width:3px;background:#4a5568;border-radius:2px}
.audio-wave-icon span:nth-child(1),.audio-wave-icon span:nth-child(5){height:12px}
.audio-wave-icon span:nth-child(2),.audio-wave-icon span:nth-child(4){height:18px}
.audio-wave-icon span:nth-child(3){height:24px}
.controls{display:flex;align-items:center;justify-content:center;gap:28px;margin-bottom:24px}
.control-btn{background:none;border:none;cursor:pointer;color:var(--accent);display:flex;align-items:center;justify-content:center}
.control-btn svg{width:20px;height:20px;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.play-pause-btn{width:52px;height:52px;background:var(--accent);color:#fff;border-radius:50%;font-size:16px}
.time-badge{background:#4e5359;color:#fff;font-size:13px;font-weight:500;padding:4px 10px;border-radius:4px;font-family:monospace;margin-bottom:16px}
.time-badge span{opacity:.5}
.waveform-wrap{width:100%;margin-bottom:8px}
.waveform-scroll-window{width:100%;height:60px;overflow:hidden;position:relative;cursor:pointer}
canvas#waveform-canvas{display:block;width:100%;height:60px}
.waveform-status{font-size:11px;color:var(--muted);text-align:center;height:16px;margin-bottom:8px}
</style>
</head>
<body>

<div class="tab-nav" id="main-tab-navigation">
  <button class="tab-btn active" onclick="switchTab('manager')"><i class="fa-solid fa-folder-open"></i> 1. Select Asset</button>
  <button class="tab-btn" onclick="switchTab('player')"><i class="fa-solid fa-compact-disc"></i> 2. Player Screen</button>
</div>

<div id="panel-manager" class="tab-panel active">
  <div class="manager-view">
    <div class="dashboard-title">Select & Manage Assets</div>
    <div class="upload-zone" onclick="document.getElementById('file-input').click()">
      <i class="fa-solid fa-photo-film"></i>
      <p>Click to upload <strong>MP3 Audio</strong> or <strong>MP4 Video</strong> tracks</p>
      <input type="file" id="file-input" accept="audio/*,video/mp4">
    </div>
    <div class="divider-row"><hr><span>OR LOAD FROM URL</span><hr></div>
    <div class="url-type-select">
      <label><input type="radio" name="url-type" value="audio" checked> Audio</label>
      <label><input type="radio" name="url-type" value="video"> Video (MP4)</label>
    </div>
    <div class="url-input-row">
      <input type="text" id="url-link-input" placeholder="https://example.com/track.mp3">
      <button onclick="handleURLLoad()"><i class="fa-solid fa-link"></i> Load</button>
    </div>
    <input type="hidden" id="edit-index" value="-1">
    <div class="form-group">
      <label id="form-action-label" for="track-name-input">Track title</label>
      <input type="text" id="track-name-input" placeholder="Display name">
    </div>
    <div class="form-group" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <div>
        <label for="fake-min-input">Fake Duration (Min)</label>
        <input type="number" id="fake-min-input" placeholder="e.g. 2" min="0">
      </div>
      <div>
        <label for="fake-sec-input">Fake Duration (Sec)</label>
        <input type="number" id="fake-sec-input" placeholder="e.g. 21" min="0" max="59">
      </div>
    </div>
    <button class="primary-btn" id="save-track-btn">Save Changes</button>
    <div class="track-list-container"><div id="track-list-target"></div></div>
  </div>
</div>

<div id="panel-player" class="tab-panel">
  <div class="player-view">
    <div class="top-bar">
      <i class="fa-solid fa-chevron-down" id="hide-tabs-trigger"></i>
      <i class="fa-solid fa-ellipsis-vertical"></i>
    </div>
    <div class="track-info" id="player-track-title">No track loaded...</div>
    <div class="stage-viewport-container">
      <div class="album-art-container" id="dom-audio-placeholder-cover">
        <div class="audio-wave-icon"><span></span><span></span><span></span><span></span><span></span></div>
      </div>
      <video class="native-video-render" id="native-video-node" playsinline></video>
    </div>
    <div class="controls">
      <button class="control-btn" id="prev-btn">
        <svg viewBox="0 0 24 24"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="4" x2="5" y2="20"></line></svg>
      </button>
      <button class="control-btn play-pause-btn" id="play-btn">
        <i class="fa-solid fa-play" id="play-icon"></i>
      </button>
      <button class="control-btn" id="next-btn">
        <svg viewBox="0 0 24 24"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="4" x2="19" y2="20"></line></svg>
      </button>
    </div>
    <div class="time-badge" id="player-time-badge">00:00 <span>| 00:00</span></div>
    <div class="waveform-wrap">
      <div class="waveform-scroll-window" id="waveform-window">
        <canvas id="waveform-canvas"></canvas>
      </div>
      <div class="waveform-status" id="waveform-status"></div>
    </div>
  </div>
</div>

<audio id="native-audio-node" preload="auto" crossorigin="anonymous"></audio>

<script>
const BAR_COUNT = 80;
const BAR_GAP = 2;

let tracks = [
  {name:"4. ONDEADON - Tito Double P",url:"",type:"audio",isPlaceholder:true,placeholderDuration:141,fakeDuration:141},
  {name:"1. Dembow Belico - Luis R Conriquez",url:"",type:"audio",isPlaceholder:true,placeholderDuration:185,fakeDuration:185},
  {name:"2. AMG - Peso Pluma x Natanael Cano",url:"",type:"audio",isPlaceholder:true,placeholderDuration:164,fakeDuration:164}
];

let currentTrackIndex = 0;
let activeNode = null;
let mockTime = 73;
let waveformPeaks = [];
let audioCtx = null;
let analyserNode = null;
let sourceNode = null;
let rafId = null;
let isAnalyserActive = false;

const audioEl = document.getElementById('native-audio-node');
const videoEl = document.getElementById('native-video-node');
const audioCover = document.getElementById('dom-audio-placeholder-cover');
const playerTitle = document.getElementById('player-track-title');
const timeBadge = document.getElementById('player-time-badge');
const playIcon = document.getElementById('play-icon');
const playBtn = document.getElementById('play-btn');
const prevBtn = document.getElementById('prev-btn');
const nextBtn = document.getElementById('next-btn');
const wfWindow = document.getElementById('waveform-window');
const wfCanvas = document.getElementById('waveform-canvas');
const wfStatus = document.getElementById('waveform-status');
const ctx2d = wfCanvas.getContext('2d');
const trackListEl = document.getElementById('track-list-target');
const trackNameIn = document.getElementById('track-name-input');
const fakeMinIn = document.getElementById('fake-min-input');
const fakeSecIn = document.getElementById('fake-sec-input');
const saveBtn = document.getElementById('save-track-btn');
const editIdxIn = document.getElementById('edit-index');
const formLabel = document.getElementById('form-action-label');
const fileInput = document.getElementById('file-input');
const urlInput = document.getElementById('url-link-input');

function fmtTime(s){
  if(isNaN(s)||s<0)return"00:00";
  const m=Math.floor(s/60),sec=Math.floor(s%60);
  return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function getFakeDuration(){
  const t=tracks[currentTrackIndex];
  return t.fakeDuration||(t.isPlaceholder?t.placeholderDuration:null)||(activeNode?activeNode.duration:120)||120;
}

function getNativeTime(){
  if(!activeNode||!activeNode.duration)return null;
  return activeNode.currentTime;
}

function getFakeTime(){
  const t=tracks[currentTrackIndex];
  if(t.isPlaceholder)return mockTime;
  const native=getNativeTime();
  if(native==null)return 0;
  const nativeDur=activeNode.duration||1;
  const fakeDur=getFakeDuration();
  return(native/nativeDur)*fakeDur;
}

function resizeCanvas(){
  const r=wfWindow.getBoundingClientRect();
  wfCanvas.width=r.width*devicePixelRatio;
  wfCanvas.height=60*devicePixelRatio;
  wfCanvas.style.width=r.width+'px';
  wfCanvas.style.height='60px';
}

function drawWaveform(currentSeconds, totalDuration){
  resizeCanvas();
  const W=wfCanvas.width, H=wfCanvas.height;
  ctx2d.clearRect(0,0,W,H);
  if(!waveformPeaks.length)return;
  const progress=Math.min(1,Math.max(0,currentSeconds/totalDuration));
  const splitIdx=Math.floor(progress*BAR_COUNT);
  const totalGap=BAR_GAP*(BAR_COUNT-1)*devicePixelRatio;
  const barW=(W-totalGap)/BAR_COUNT;
  const maxH=H*0.9;
  const centerY=H/2;
  for(let i=0;i<BAR_COUNT;i++){
    const peak=waveformPeaks[i]||0;
    const barH=Math.max(3*devicePixelRatio, peak*maxH);
    const x=i*(barW+BAR_GAP*devicePixelRatio);
    ctx2d.fillStyle=i<=splitIdx?'#2c3135':'#d1d5db';
    const r=Math.min(2*devicePixelRatio, barW/2);
    ctx2d.beginPath();
    ctx2d.roundRect(x, centerY-barH/2, barW, barH, r);
    ctx2d.fill();
  }
}

function drawLiveBars(){
  if(!isAnalyserActive||!analyserNode)return;
  resizeCanvas();
  const W=wfCanvas.width, H=wfCanvas.height;
  const bufLen=analyserNode.frequencyBinCount;
  const dataArr=new Uint8Array(bufLen);
  analyserNode.getByteFrequencyData(dataArr);
  ctx2d.clearRect(0,0,W,H);
  const totalGap=BAR_GAP*(BAR_COUNT-1)*devicePixelRatio;
  const barW=(W-totalGap)/BAR_COUNT;
  const maxH=H*0.9;
  const centerY=H/2;
  const step=Math.floor(bufLen/BAR_COUNT);
  for(let i=0;i<BAR_COUNT;i++){
    const val=dataArr[i*step]/255;
    const barH=Math.max(3*devicePixelRatio, val*maxH);
    const x=i*(barW+BAR_GAP*devicePixelRatio);
    ctx2d.fillStyle='#2c3135';
    const r=Math.min(2*devicePixelRatio, barW/2);
    ctx2d.beginPath();
    ctx2d.roundRect(x, centerY-barH/2, barW, barH, r);
    ctx2d.fill();
  }
  rafId=requestAnimationFrame(drawLiveBars);
}

async function decodeWaveformFromBlob(url){
  wfStatus.textContent='Analyzing audio...';
  waveformPeaks=[];
  try{
    const resp=await fetch(url,{mode:'cors'});
    if(!resp.ok)throw new Error('fetch failed');
    const buf=await resp.arrayBuffer();
    const tmpCtx=new (window.AudioContext||window.webkitAudioContext)();
    const decoded=await tmpCtx.decodeAudioData(buf);
    tmpCtx.close();
    const channelData=decoded.getChannelData(0);
    const total=channelData.length;
    const chunkSize=Math.floor(total/BAR_COUNT);
    const peaks=[];
    for(let i=0;i<BAR_COUNT;i++){
      const start=i*chunkSize;
      let max=0;
      for(let j=start;j<start+chunkSize;j++){
        const abs=Math.abs(channelData[j]);
        if(abs>max)max=abs;
      }
      peaks.push(max);
    }
    const maxPeak=Math.max(...peaks)||1;
    waveformPeaks=peaks.map(p=>p/maxPeak);
    wfStatus.textContent='';
    return true;
  }catch(e){
    wfStatus.textContent='Waveform preview unavailable (CORS or decode error)';
    genFallbackPeaks();
    return false;
  }
}

function genFallbackPeaks(){
  waveformPeaks=[];
  for(let i=0;i<BAR_COUNT;i++){
    let h=0.25+Math.sin(i*0.22)*0.2+Math.cos(i*0.45)*0.15;
    waveformPeaks.push(Math.max(0.1,Math.min(0.95,h)));
  }
}

function genPlaceholderPeaks(){
  waveformPeaks=[];
  for(let i=0;i<BAR_COUNT;i++){
    let h=0.25+Math.sin(i*0.22)*0.2+Math.cos(i*0.45)*0.15;
    waveformPeaks.push(Math.max(0.1,Math.min(0.95,h)));
  }
}

function setupAnalyser(mediaEl){
  if(!audioCtx){
    audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  }
  if(sourceNode){try{sourceNode.disconnect()}catch(e){}}
  sourceNode=audioCtx.createMediaElementSource(mediaEl);
  analyserNode=audioCtx.createAnalyser();
  analyserNode.fftSize=2048;
  sourceNode.connect(analyserNode);
  analyserNode.connect(audioCtx.destination);
  isAnalyserActive=true;
}

function stopAnalyser(){
  isAnalyserActive=false;
  if(rafId){cancelAnimationFrame(rafId);rafId=null;}
}

function updatePlayPauseUI(){
  const playing=activeNode&&!activeNode.paused&&activeNode.src&&activeNode.src!==location.href;
  playIcon.className=playing?'fa-solid fa-pause':'fa-solid fa-play';
}

function syncProgress(){
  const t=tracks[currentTrackIndex];
  const fake=getFakeTime();
  const dur=getFakeDuration();
  timeBadge.innerHTML=`${fmtTime(fake)} <span>| ${fmtTime(dur)}</span>`;
  if(!isAnalyserActive){
    drawWaveform(fake,dur);
  }
}

async function loadTrack(index, autoplay=false){
  if(index<0||index>=tracks.length)return;
  audioEl.pause(); videoEl.pause();
  stopAnalyser();
  currentTrackIndex=index;
  const t=tracks[currentTrackIndex];
  playerTitle.innerText=t.name;

  if(t.type==='video'){
    activeNode=videoEl;
    audioCover.style.display='none';
    videoEl.style.display='block';
    videoEl.src=t.url;
    videoEl.load();
    videoEl.currentTime=0;
    genFallbackPeaks();
    wfStatus.textContent='Video track — no waveform';
    drawWaveform(0, getFakeDuration());
    if(autoplay) videoEl.play().catch(()=>{});
  } else {
    activeNode=audioEl;
    audioCover.style.display='flex';
    videoEl.style.display='none';
    if(t.isPlaceholder){
      audioEl.src='';
      genPlaceholderPeaks();
      wfStatus.textContent='Placeholder — upload or link a file to see real waveform';
      drawWaveform(mockTime, getFakeDuration());
    } else {
      audioEl.src=t.url;
      audioEl.load();
      audioEl.currentTime=0;
      wfStatus.textContent='';
      const ok=await decodeWaveformFromBlob(t.url);
      drawWaveform(0, getFakeDuration());
      if(autoplay){
        if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();
        try{ setupAnalyser(audioEl); }catch(e){ isAnalyserActive=false; }
        audioEl.play().then(()=>{
          if(isAnalyserActive) drawLiveBars();
        }).catch(()=>{});
      }
    }
  }
  updatePlayPauseUI();
  renderPlaylist();
}

window.switchTab=function(panel){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  if(panel==='manager'){
    document.querySelectorAll('.tab-btn')[0].classList.add('active');
    document.getElementById('panel-manager').classList.add('active');
  } else {
    document.querySelectorAll('.tab-btn')[1].classList.add('active');
    document.getElementById('panel-player').classList.add('active');
    syncProgress();
  }
};

function renderPlaylist(){
  trackListEl.innerHTML='';
  tracks.forEach((t,i)=>{
    const item=document.createElement('div');
    item.className=`track-item${i===currentTrackIndex?' active':''}`;
    item.addEventListener('click',e=>{
      if(e.target.closest('.action-btn'))return;
      loadTrack(i,true);
      switchTab('player');
    });
    let dur=t.isPlaceholder?fmtTime(t.fakeDuration||t.placeholderDuration):t.fakeDuration?fmtTime(t.fakeDuration)+' (fake)':'Live';
    const icon=t.type==='video'?'<i class="fa-solid fa-video"></i>':'<i class="fa-solid fa-music"></i>';
    const urlBadge=t.isURL?'<span style="font-size:10px;background:#e0f2fe;color:#0369a1;padding:2px 6px;border-radius:4px;margin-left:6px;font-weight:600">URL</span>':'';
    item.innerHTML=`<div class="track-item-info"><div class="track-item-name">${t.name}${urlBadge}</div><div class="track-item-meta"><span style="margin-right:10px">${icon} ${t.type.toUpperCase()}</span><span>${dur}</span></div></div><div class="track-actions"><button class="action-btn edit-btn" onclick="openEditor(event,${i})"><i class="fa-solid fa-pen-to-square"></i></button><button class="action-btn delete-btn" onclick="removeTrack(event,${i})"><i class="fa-solid fa-trash"></i></button></div>`;
    trackListEl.appendChild(item);
  });
}

window.openEditor=function(e,i){
  e.stopPropagation();
  const t=tracks[i];
  trackNameIn.value=t.name;
  editIdxIn.value=i;
  formLabel.innerText=`Edit Track #${i+1}:`;
  fakeMinIn.value=t.fakeDuration?Math.floor(t.fakeDuration/60):'';
  fakeSecIn.value=t.fakeDuration?Math.floor(t.fakeDuration%60):'';
  trackNameIn.focus();
};

window.removeTrack=function(e,i){
  e.stopPropagation();
  if(tracks.length<=1)return;
  tracks.splice(i,1);
  if(currentTrackIndex>=tracks.length)currentTrackIndex=tracks.length-1;
  loadTrack(currentTrackIndex,false);
};

saveBtn.addEventListener('click',()=>{
  const v=trackNameIn.value.trim();
  const idx=parseInt(editIdxIn.value,10);
  if(!v||idx<0||idx>=tracks.length)return;
  tracks[idx].name=v;
  const calc=(parseInt(fakeMinIn.value,10)||0)*60+(parseInt(fakeSecIn.value,10)||0);
  tracks[idx].fakeDuration=calc>0?calc:null;
  if(idx===currentTrackIndex){playerTitle.innerText=v;syncProgress();}
  editIdxIn.value='-1'; trackNameIn.value=''; fakeMinIn.value=''; fakeSecIn.value='';
  formLabel.innerText='Track title';
  renderPlaylist();
});

window.handleURLLoad=function(){
  const raw=urlInput.value.trim();
  if(!raw){alert('Please enter a URL.');return;}
  let url; try{url=new URL(raw)}catch(e){alert('Invalid URL.');return;}
  const type=document.querySelector('input[name="url-type"]:checked').value;
  const name=decodeURIComponent(url.pathname.split('/').pop().replace(/\.[^/.]+$/,'')||'Untitled');
  tracks.push({name,url:raw,type,isPlaceholder:false,fakeDuration:null,isURL:true});
  urlInput.value='';
  renderPlaylist();
  switchTab('player');
  loadTrack(tracks.length-1,true);
};

urlInput.addEventListener('keydown',e=>{if(e.key==='Enter')handleURLLoad();});

playBtn.addEventListener('click',async()=>{
  const t=tracks[currentTrackIndex];
  if(t.isPlaceholder){alert('Upload or link a file first.');return;}
  if(!activeNode)return;
  if(activeNode.paused){
    if(audioCtx&&audioCtx.state==='suspended')await audioCtx.resume();
    if(activeNode===audioEl){
      try{ if(!isAnalyserActive) setupAnalyser(audioEl); }catch(e){}
    }
    activeNode.play().then(()=>{
      if(isAnalyserActive&&!rafId) drawLiveBars();
    }).catch(()=>{});
  } else {
    activeNode.pause();
    stopAnalyser();
    syncProgress();
  }
  updatePlayPauseUI();
});

prevBtn.addEventListener('click',()=>{
  const i=currentTrackIndex-1<0?tracks.length-1:currentTrackIndex-1;
  mockTime=0; loadTrack(i,true);
});
nextBtn.addEventListener('click',()=>{
  const i=(currentTrackIndex+1)%tracks.length;
  mockTime=0; loadTrack(i,true);
});

audioEl.addEventListener('timeupdate',()=>{
  if(!isAnalyserActive) syncProgress();
  else{
    const fake=getFakeTime();
    const dur=getFakeDuration();
    timeBadge.innerHTML=`${fmtTime(fake)} <span>| ${fmtTime(dur)}</span>`;
  }
});
videoEl.addEventListener('timeupdate',syncProgress);

[audioEl,videoEl].forEach(el=>{
  el.addEventListener('play',updatePlayPauseUI);
  el.addEventListener('pause',()=>{updatePlayPauseUI();stopAnalyser();syncProgress();});
  el.addEventListener('ended',()=>{
    stopAnalyser();
    const i=(currentTrackIndex+1)%tracks.length;
    mockTime=0; loadTrack(i,true);
  });
});

wfWindow.addEventListener('click',e=>{
  const t=tracks[currentTrackIndex];
  const rect=wfWindow.getBoundingClientRect();
  const ratio=Math.min(1,Math.max(0,(e.clientX-rect.left)/rect.width));
  if(t.isPlaceholder){
    mockTime=Math.floor(ratio*(t.fakeDuration||t.placeholderDuration));
    drawWaveform(mockTime, getFakeDuration());
    timeBadge.innerHTML=`${fmtTime(mockTime)} <span>| ${fmtTime(getFakeDuration())}</span>`;
  } else if(activeNode&&activeNode.duration){
    activeNode.currentTime=ratio*activeNode.duration;
    syncProgress();
    if(!isAnalyserActive) drawWaveform(getFakeTime(),getFakeDuration());
  }
});

fileInput.addEventListener('change',e=>{
  const file=e.target.files[0]; if(!file)return;
  let type='';
  if(file.type.startsWith('audio/'))type='audio';
  else if(file.type==='video/mp4')type='video';
  else{alert('Upload MP3 or MP4 only.');return;}
  tracks.push({name:file.name.replace(/\.[^/.]+$/,''),url:URL.createObjectURL(file),type,isPlaceholder:false,fakeDuration:null});
  renderPlaylist();
  switchTab('player');
  loadTrack(tracks.length-1,true);
});

document.getElementById('hide-tabs-trigger').addEventListener('click',()=>{
  document.getElementById('main-tab-navigation').classList.toggle('hidden-tabs');
  document.getElementById('hide-tabs-trigger').classList.toggle('tabs-are-hidden');
});

genPlaceholderPeaks();
renderPlaylist();
loadTrack(0,false);
window.addEventListener('resize',()=>syncProgress());
</script>
</body>
</html>
